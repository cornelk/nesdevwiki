baseURL = "https://nesdev.cornel.contact/"
title = "NESdev Wiki"
locale = "en"
defaultContentLanguage = "en"
theme = "hugo-geekdoc"
enableRobotsTXT = true
timeZone = "UTC"

# The wiki has no taxonomies: categories are rendered from the wikiCategories front matter.
disableKinds = ["taxonomy", "term"]

[outputs]
home = ["html"]
section = ["html"]
page = ["html"]

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[sitemap]
changefreq = "monthly"
priority = 0.5

[params]
description = "The NES development wiki: hardware, mappers, programming and tools for the Nintendo Entertainment System and Famicom."

# Geekdoc theme: the sidebar comes from data/menu/*.yaml, search is done by Pagefind.
geekdocMenuBundle = true
geekdocSearch = false
geekdocBreadcrumb = false
geekdocNextPrev = false
wikiEditURL = "https://github.com/cornelk/nesdevwiki/edit/main"
geekdocPrivacyPolicy = "/wiki/Nesdev_wiki_Privacy_policy/"

[params.geekdocContentLicense]
name = "Public domain"
link = "/wiki/Nesdev_wiki_General_disclaimer/"

# Keep the published /wiki-images/<file> paths while grouping image sources by their first character.
[module]
[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "assets/wiki-images/0-9"
target = "static/wiki-images"
